  <g id="text_19">
   <text style="fill: #243442; font: 700 19px 'DejaVu Sans'; text-anchor: start" x="51.84" y="38.917031" transform="rotate(-0 51.84 38.917031)">Specialist relevance: what the missing labels permit</text>
  </g>
  <g id="text_20">
   <text style="fill: #586a78; font: 11px 'DejaVu Sans'; text-anchor: start" x="51.84" y="59.364" transform="rotate(-0 51.84 59.364)">Cycle 03  |  Fixed SPLADE++ specialists  |  Separate annual query panels</text>
  </g>
  <g id="text_21">
   <text style="fill: #586a78; font: 9.2px 'DejaVu Sans'; text-anchor: start" x="51.84" y="501.84" transform="rotate(-0 51.84 501.84)">Gray band: ±10 percentage points, the prespecified research decision threshold.</text>
  </g>
  <g id="text_22">
   <text style="fill: #586a78; font: 9.2px 'DejaVu Sans'; text-anchor: start" x="51.84" y="522.036" transform="rotate(-0 51.84 522.036)">Sharp intervals allow every missing label to favor the opposite group. Query contrasts have equal weight.</text>
  </g>
  <g id="text_23">
   <text style="fill: #586a78; font: 9.2px 'DejaVu Sans'; text-anchor: start" x="51.84" y="542.232" transform="rotate(-0 51.84 542.232)">The bootstrap envelope adds conditional query-sampling uncertainty; it is not an exact confidence guarantee.</text>
  </g>
  <g id="text_24">
   <text style="fill: #586a78; font: 9.2px 'DejaVu Sans'; text-anchor: start" x="51.84" y="562.428" transform="rotate(-0 51.84 562.428)">Association does not isolate candidate access from corroboration or demonstrate a fusion gain.</text>
  </g>
  <g id="text_25">
   <text style="fill: #586a78; font: 9.2px 'DejaVu Sans'; text-anchor: start" x="51.84" y="582.624" transform="rotate(-0 51.84 582.624)">The secondary threshold is descriptive and cannot override the primary decision.</text>
  </g>
